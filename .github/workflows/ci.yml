name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `injectWorkspacePackages` snapshots workspace output at install time, so
      # every package that consumes the design system through `node_modules`
      # needs the dist to exist *before* the install that follows its build.
      # Order: build design-system -> re-install -> everything else.
      - name: Build design system
        run: pnpm --filter @kickstartds/design-system run build

      - name: Re-inject workspace output
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build
        # The website package fetches its page list and images from Storyblok at
        # build time, so this step needs CMS credentials. Without them the two
        # CMS scripts skip and `next build` cannot enumerate any path.
        env:
          NEXT_STORYBLOK_API_TOKEN: ${{ secrets.NEXT_STORYBLOK_API_TOKEN }}
          NEXT_STORYBLOK_OAUTH_TOKEN: ${{ secrets.NEXT_STORYBLOK_OAUTH_TOKEN }}
          NEXT_STORYBLOK_SPACE_ID: ${{ secrets.NEXT_STORYBLOK_SPACE_ID }}
          NEXT_OPENAI_API_KEY: ${{ secrets.NEXT_OPENAI_API_KEY }}

      - name: Type check
        run: pnpm -r run typecheck

      - name: Run tests
        run: pnpm -r run test

      - name: Lint
        run: pnpm -r run lint

  chromatic:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm --filter @kickstartds/design-system chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
