# Frozen static snapshot of the pre-monorepo ruhmesmeile.com, served by nginx.
# `service: legacy` keeps the kamal-proxy app name distinct from `server`/`website`;
# two apps cannot claim the same host.
service: legacy

image: ruhmesmeile/ruhmesmeile-legacy-website

servers:
  web:
    - 91.98.115.152

proxy:
  ssl: true
  hosts:
    - legacy.ruhmesmeile.com
  app_port: 80
  healthcheck:
    path: /

registry:
  username: ruhmesmeile
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: Dockerfile.legacy
