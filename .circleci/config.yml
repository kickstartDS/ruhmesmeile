version: 2.1

defaults: &defaults
  docker:
    - image: cimg/ruby:3.4.7
  resource_class: medium

jobs:
  deploy:
    <<: *defaults
    steps:
      - checkout:
          # `packages/design-system/static/**` and the website's
          # `types/components-*.json` are Git LFS objects; without this the
          # build sees pointer files instead of the real assets and JSON.
          lfs: true
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install Kamal
          command: gem install kamal
      - run:
          name: Build & Deploy Website
          # `config/deploy-website.yml` is ERB-evaluated against the process
          # environment; the committed, secret-free `packages/website/.env`
          # supplies the domains, image name and host, so only the tokens have
          # to live in this project's env vars.
          command: |
            set -a
            . packages/website/.env
            set +a
            kamal deploy -c config/deploy-website.yml

workflows:
  release:
    jobs:
      - deploy:
          filters:
            branches:
              only: [main]
