# nginx config for the frozen static snapshot.
#
# Next.js `next export` writes one file per page as `<path>.html` (no
# directory index), while the production site serves clean URLs without a
# trailing slash. Mirror that: resolve `<path>.html` for `<path>`, and
# redirect `<path>/` to `<path>` so the snapshot is addressable at exactly
# the URLs phase 8 compares.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers: the container is reached over TLS via
    # kamal-proxy, so an absolute http:// redirect would add a hop.
    absolute_redirect off;

    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }

    # `<path>/` -> `<path>`, matching the production server's 308.
    location ~ ^/(.+)/$ {
        return 308 /$1;
    }

    location / {
        try_files $uri.html $uri $uri/index.html =404;
    }
}
